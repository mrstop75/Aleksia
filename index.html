<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Το Βασίλειο της Αλεξίας 🦄</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #fbc2eb 0%, #a6c1ee 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { color: #d63384; font-size: 2rem; }
        p { color: #555; font-size: 1.2rem; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #9b59b6;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.1); background: #8e44ad; }
        .emoji { font-size: 3rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">👑</div>
        <h1>Καλώς ήρθατε στο Βασίλειο!</h1>
        <p>Ένα δώρο από την Αλεξία για την ονομαστική της εορτή.</p>
        <a href="game.html" class="btn">ΠΑΙΞΕ ΤΟ ΠΑΙΧΝΙΔΙ 🎮</a>
    </div>
</body>
</html>
