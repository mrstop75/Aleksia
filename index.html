<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Το Βασίλειο της Αλεξίας 🦄</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff6eb4;
            --dpink: #e91e8c;
            --violet: #9b59b6;
            --gold: #ffd700;
        }

        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Animated gradient background */
            background: linear-gradient(-45deg, #2d0050, #6c1a8a, #c0185e, #ff6eb4);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating stars/shapes in the background */
        .bg-deco {
            position: absolute;
            color: rgba(255, 255, 255, 0.3);
            user-select: none;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 30px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 85%;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .unicorn-main {
            font-size: 6rem;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            margin-bottom: 20px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: white;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin: 0 0 20px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        p {
            color: #ffe0f5;
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 35px;
            font-weight: 700;
        }

        .play-btn {
            display: inline-block;
            background: #ffd700;
            color: #6c1a8a;
            text-decoration: none;
            padding: 22px 55px;
            border-radius: 60px;
            font-family: 'Fredoka One', cursive;
            font-size: 1.6rem;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid white;
        }

        .play-btn:hover {
            transform: scale(1.1);
            background: white;
            color: var(--dpink);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.5);
        }

        /* Small sparkles animation */
        .sparkle {
            position: absolute;
            animation: twinkle 3s infinite;
            opacity: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="bg-deco" style="top: 10%; left: 15%; font-size: 3rem;">⭐</div>
    <div class="bg-deco" style="top: 70%; left: 5%; font-size: 2.5rem;">🌈</div>
    <div class="bg-deco" style="top: 20%; right: 10%; font-size: 4rem;">✨</div>
    <div class="bg-deco" style="bottom: 10%; right: 15%; font-size: 2rem;">🌸</div>

    <div class="container">
        <span class="unicorn-main">🦄</span>
        <h1>Καλώς ήρθατε στο Βασίλειο της Αλεξίας!</h1>
        <p>Αυτό είναι το μικρό μου δώρο για εσάς για την ονομαστική μου γιορτή!<br>Ας μάθουμε παρέα!</p>
        <a href="game.html" class="play-btn">ΠΑΙΞΕ ΕΔΩ! 🎮</a> 
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSftQvbJWGhmQDUJiOEo9lEfHGFpRau6RYgTjYwggVz_ZNmwyw/viewform" target="_blank" class="btn msg-btn">
        ΣΤΕΙΛΕ ΜΟΥ ΕΥΧΗ! 💌
    </a>
</div>
    </div>

    <script>
        // Add tiny random sparkles for extra magic
        for (let i = 0; i < 15; i++) {
            const s = document.createElement('div');
            s.className = 'sparkle';
            s.innerHTML = '✨';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 5 + 's';
            s.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(s);
        }
    </script>
</body>
</html>
